server.port=8080

# Application Details
spring.application.name=healthbridge-backend

# ==============================================================================
# Database Configuration (Supabase PostgreSQL / Cloud DB with Dev Fallback)
# ==============================================================================
# Direct Supabase Connection:
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.gdvnvticqawvaorhktda.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASS:M@nsi-615-1978}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security & Cryptographic Settings (PBKDF2-HMAC-SHA256 & JWT)
app.security.pbkdf2.salt=HealthBridgeSecuredSaltABDM2026!#$
app.security.pbkdf2.iterations=65536
app.security.pbkdf2.key-length=256
app.security.jwt.secret=healthBridgeSecretKeyForABDMHackathon2026MustBeAtLeast256BitsLong!
app.security.jwt.expiration-ms=86400000

# H2 Web Console for direct in-browser database inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.spectra.health=INFO
logging.level.org.springframework.web=INFO
